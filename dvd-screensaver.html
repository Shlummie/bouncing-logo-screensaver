<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD Screensaver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <script>
        // ============================================================
        // TWEAKABLE CONSTANTS
        // ============================================================
        const CANVAS_WIDTH = 1920;          // Internal canvas width
        const CANVAS_HEIGHT = 1080;         // Internal canvas height
        const LOGO_SCALE = 1.0;             // Logo size multiplier (0.5 = half, 2.0 = double)
        const SPEED = 200;                  // Pixels per second
        const GLOW_STRENGTH = 20;           // Shadow blur for glow effect (0 = no glow)
        const CORNER_TOLERANCE = 15;        // Pixel tolerance for corner hit detection
        const PULSE_DURATION = 120;         // Brightness pulse duration in ms
        const SPARKLE_DURATION = 280;       // Corner sparkle effect duration in ms
        const SPARKLE_PARTICLE_COUNT = 24;  // Number of sparkle particles
        
        // Color palette for logo
        const COLOR_PALETTE = [
            '#FF0080',  // Hot pink
            '#00FFFF',  // Cyan
            '#FF6600',  // Orange
            '#00FF00',  // Green
            '#FFFF00',  // Yellow
            '#FF00FF',  // Magenta
            '#00FF80',  // Spring green
            '#FF4444',  // Red
            '#4488FF',  // Blue
        ];
        
        // ============================================================
        // STATE VARIABLES
        // ============================================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Set internal resolution
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;
        
        // Logo dimensions (base size before scaling)
        const BASE_LOGO_WIDTH = 280;
        const BASE_LOGO_HEIGHT = 140;
        const logoWidth = BASE_LOGO_WIDTH * LOGO_SCALE;
        const logoHeight = BASE_LOGO_HEIGHT * LOGO_SCALE;
        
        // Position and velocity
        let x = Math.random() * (CANVAS_WIDTH - logoWidth);
        let y = Math.random() * (CANVAS_HEIGHT - logoHeight);
        
        // Random initial direction (diagonal)
        let vx = (Math.random() > 0.5 ? 1 : -1);
        let vy = (Math.random() > 0.5 ? 1 : -1);
        
        // Current color
        let currentColorIndex = Math.floor(Math.random() * COLOR_PALETTE.length);
        let currentColor = COLOR_PALETTE[currentColorIndex];
        
        // Animation state
        let lastTime = 0;
        let pulseTimer = 0;
        let pulseActive = false;
        
        // Sparkle effect
        let sparkles = [];
        let sparkleTimer = 0;
        let sparkleActive = false;
        let sparkleX = 0;
        let sparkleY = 0;
        
        // Debug mode
        let debugMode = false;
        let collisionCount = 0;
        let cornerHitCount = 0;
        
        // ============================================================
        // WINDOW RESIZE HANDLER - Letterboxing/Pillarboxing
        // ============================================================
        function resizeCanvas() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const targetAspect = CANVAS_WIDTH / CANVAS_HEIGHT;
            const windowAspect = windowWidth / windowHeight;
            
            let displayWidth, displayHeight;
            
            if (windowAspect > targetAspect) {
                // Window is wider - pillarbox (black bars on sides)
                displayHeight = windowHeight;
                displayWidth = windowHeight * targetAspect;
            } else {
                // Window is taller - letterbox (black bars top/bottom)
                displayWidth = windowWidth;
                displayHeight = windowWidth / targetAspect;
            }
            
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // ============================================================
        // KEYBOARD HANDLER
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd') {
                debugMode = !debugMode;
            }
        });
        
        // ============================================================
        // DRAW DVD LOGO (Vector-based)
        // ============================================================
        function drawDVDLogo(cx, cy, scale, color, brightness) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);
            
            // Apply brightness multiplier
            const brightColor = adjustBrightness(color, brightness);
            
            // Glow effect
            if (GLOW_STRENGTH > 0) {
                ctx.shadowColor = brightColor;
                ctx.shadowBlur = GLOW_STRENGTH * brightness;
            }
            
            ctx.fillStyle = brightColor;
            ctx.strokeStyle = brightColor;
            
            // ---- Draw "DVD" letters ----
            const letterSpacing = 75;
            const startX = -110;
            const dvdY = -25;
            
            // Letter D (first)
            drawLetterD(startX, dvdY);
            
            // Letter V
            drawLetterV(startX + letterSpacing, dvdY);
            
            // Letter D (second)
            drawLetterD(startX + letterSpacing * 2, dvdY);
            
            // ---- Draw oval/swoosh underline ----
            ctx.beginPath();
            ctx.ellipse(0, 25, 120, 18, 0, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.stroke();
            
            // ---- Draw "VIDEO" text ----
            ctx.font = 'bold 28px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.letterSpacing = '8px';
            
            // Draw VIDEO using basic shapes since we can't rely on fonts
            drawVideoText(0, 42);
            
            ctx.restore();
        }
        
        // Draw letter D
        function drawLetterD(x, y) {
            ctx.beginPath();
            ctx.moveTo(x - 25, y - 35);
            ctx.lineTo(x - 25, y + 35);
            ctx.lineTo(x + 5, y + 35);
            ctx.bezierCurveTo(x + 35, y + 35, x + 35, y - 35, x + 5, y - 35);
            ctx.closePath();
            ctx.fill();
            
            // Inner cutout
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.moveTo(x - 12, y - 20);
            ctx.lineTo(x - 12, y + 20);
            ctx.lineTo(x + 2, y + 20);
            ctx.bezierCurveTo(x + 18, y + 20, x + 18, y - 20, x + 2, y - 20);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            
            // Redraw inner area with color for proper glow
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(x - 12, y - 20);
            ctx.lineTo(x - 12, y + 20);
            ctx.lineTo(x + 2, y + 20);
            ctx.bezierCurveTo(x + 18, y + 20, x + 18, y - 20, x + 2, y - 20);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = adjustBrightness(currentColor, pulseActive ? 1.5 : 1.0);
        }
        
        // Draw letter V
        function drawLetterV(x, y) {
            ctx.beginPath();
            ctx.moveTo(x - 28, y - 35);
            ctx.lineTo(x, y + 35);
            ctx.lineTo(x + 28, y - 35);
            ctx.lineTo(x + 15, y - 35);
            ctx.lineTo(x, y + 15);
            ctx.lineTo(x - 15, y - 35);
            ctx.closePath();
            ctx.fill();
        }
        
        // Draw "VIDEO" using vector shapes
        function drawVideoText(cx, y) {
            const scale = 0.45;
            const spacing = 26;
            let x = cx - spacing * 2;
            
            ctx.save();
            ctx.translate(0, y);
            ctx.scale(scale, scale);
            
            // V
            ctx.beginPath();
            ctx.moveTo(x - 12, 0);
            ctx.lineTo(x, 28);
            ctx.lineTo(x + 12, 0);
            ctx.lineTo(x + 6, 0);
            ctx.lineTo(x, 18);
            ctx.lineTo(x - 6, 0);
            ctx.closePath();
            ctx.fill();
            x += spacing;
            
            // I
            ctx.fillRect(x - 4, 0, 8, 28);
            x += spacing;
            
            // D
            ctx.beginPath();
            ctx.moveTo(x - 10, 0);
            ctx.lineTo(x - 10, 28);
            ctx.lineTo(x + 2, 28);
            ctx.bezierCurveTo(x + 14, 28, x + 14, 0, x + 2, 0);
            ctx.closePath();
            ctx.fill();
            ctx.save();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(x - 3, 6);
            ctx.lineTo(x - 3, 22);
            ctx.lineTo(x + 1, 22);
            ctx.bezierCurveTo(x + 7, 22, x + 7, 6, x + 1, 6);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            x += spacing;
            
            // E
            ctx.fillRect(x - 10, 0, 18, 6);
            ctx.fillRect(x - 10, 0, 6, 28);
            ctx.fillRect(x - 10, 11, 14, 6);
            ctx.fillRect(x - 10, 22, 18, 6);
            x += spacing;
            
            // O
            ctx.beginPath();
            ctx.ellipse(x, 14, 11, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(x, 14, 5, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            ctx.restore();
        }
        
        // ============================================================
        // COLOR UTILITIES
        // ============================================================
        function adjustBrightness(hex, factor) {
            // Parse hex color
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            
            // Adjust brightness
            r = Math.min(255, Math.floor(r * factor));
            g = Math.min(255, Math.floor(g * factor));
            b = Math.min(255, Math.floor(b * factor));
            
            return `rgb(${r}, ${g}, ${b})`;
        }
        
        function getNextColor() {
            currentColorIndex = (currentColorIndex + 1) % COLOR_PALETTE.length;
            // Avoid getting the same color
            if (COLOR_PALETTE[currentColorIndex] === currentColor) {
                currentColorIndex = (currentColorIndex + 1) % COLOR_PALETTE.length;
            }
            return COLOR_PALETTE[currentColorIndex];
        }
        
        // ============================================================
        // SPARKLE EFFECT
        // ============================================================
        function createSparkles(cx, cy) {
            sparkles = [];
            for (let i = 0; i < SPARKLE_PARTICLE_COUNT; i++) {
                const angle = (Math.PI * 2 / SPARKLE_PARTICLE_COUNT) * i + Math.random() * 0.3;
                const speed = 150 + Math.random() * 200;
                sparkles.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    size: 2 + Math.random() * 4,
                    color: COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)]
                });
            }
            sparkleActive = true;
            sparkleTimer = 0;
            sparkleX = cx;
            sparkleY = cy;
        }
        
        function updateSparkles(dt) {
            if (!sparkleActive) return;
            
            sparkleTimer += dt * 1000;
            
            for (let spark of sparkles) {
                spark.x += spark.vx * dt;
                spark.y += spark.vy * dt;
                spark.life = 1 - (sparkleTimer / SPARKLE_DURATION);
                spark.vx *= 0.98;
                spark.vy *= 0.98;
            }
            
            if (sparkleTimer >= SPARKLE_DURATION) {
                sparkleActive = false;
                sparkles = [];
            }
        }
        
        function drawSparkles() {
            if (!sparkleActive) return;
            
            ctx.save();
            for (let spark of sparkles) {
                if (spark.life <= 0) continue;
                
                ctx.globalAlpha = spark.life;
                ctx.fillStyle = spark.color;
                ctx.shadowColor = spark.color;
                ctx.shadowBlur = 10;
                
                // Draw star shape
                ctx.beginPath();
                const size = spark.size * spark.life;
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI / 2) * i;
                    ctx.moveTo(spark.x, spark.y);
                    ctx.lineTo(
                        spark.x + Math.cos(angle) * size * 2,
                        spark.y + Math.sin(angle) * size * 2
                    );
                }
                ctx.lineWidth = size * 0.5;
                ctx.strokeStyle = spark.color;
                ctx.stroke();
                
                // Center dot
                ctx.beginPath();
                ctx.arc(spark.x, spark.y, size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        
        // ============================================================
        // DEBUG OVERLAY
        // ============================================================
        function drawDebug() {
            if (!debugMode) return;
            
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(10, 10, 320, 130);
            
            ctx.fillStyle = '#fff';
            ctx.font = '16px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.shadowBlur = 0;
            
            const lines = [
                `Position: (${Math.round(x)}, ${Math.round(y)})`,
                `Velocity: (${vx > 0 ? '+' : ''}${(vx * SPEED).toFixed(0)}, ${vy > 0 ? '+' : ''}${(vy * SPEED).toFixed(0)}) px/s`,
                `Direction: (${vx > 0 ? 'RIGHT' : 'LEFT'}, ${vy > 0 ? 'DOWN' : 'UP'})`,
                `Wall Collisions: ${collisionCount}`,
                `Corner Hits: ${cornerHitCount}`,
                `Press 'D' to hide debug`
            ];
            
            lines.forEach((line, i) => {
                ctx.fillText(line, 20, 20 + i * 20);
            });
            
            ctx.restore();
        }
        
        // ============================================================
        // MAIN UPDATE LOOP
        // ============================================================
        function update(timestamp) {
            // Calculate delta time
            if (lastTime === 0) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Cap at 100ms
            lastTime = timestamp;
            
            // Update pulse timer
            if (pulseActive) {
                pulseTimer += dt * 1000;
                if (pulseTimer >= PULSE_DURATION) {
                    pulseActive = false;
                    pulseTimer = 0;
                }
            }
            
            // Update sparkles
            updateSparkles(dt);
            
            // Move logo
            x += vx * SPEED * dt;
            y += vy * SPEED * dt;
            
            // Collision detection
            let hitX = false;
            let hitY = false;
            
            // Right edge
            if (x + logoWidth >= CANVAS_WIDTH) {
                x = CANVAS_WIDTH - logoWidth;
                vx = -1;
                hitX = true;
            }
            // Left edge
            if (x <= 0) {
                x = 0;
                vx = 1;
                hitX = true;
            }
            // Bottom edge
            if (y + logoHeight >= CANVAS_HEIGHT) {
                y = CANVAS_HEIGHT - logoHeight;
                vy = -1;
                hitY = true;
            }
            // Top edge
            if (y <= 0) {
                y = 0;
                vy = 1;
                hitY = true;
            }
            
            // Handle collisions
            if (hitX || hitY) {
                collisionCount++;
                currentColor = getNextColor();
                pulseActive = true;
                pulseTimer = 0;
                
                // Check for corner hit
                const nearLeft = x <= CORNER_TOLERANCE;
                const nearRight = x + logoWidth >= CANVAS_WIDTH - CORNER_TOLERANCE;
                const nearTop = y <= CORNER_TOLERANCE;
                const nearBottom = y + logoHeight >= CANVAS_HEIGHT - CORNER_TOLERANCE;
                
                if ((nearLeft || nearRight) && (nearTop || nearBottom)) {
                    // Corner hit!
                    cornerHitCount++;
                    const sparkX = nearLeft ? 0 : CANVAS_WIDTH;
                    const sparkY = nearTop ? 0 : CANVAS_HEIGHT;
                    createSparkles(sparkX, sparkY);
                }
            }
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Calculate brightness for pulse effect
            let brightness = 1.0;
            if (pulseActive) {
                const pulseProgress = pulseTimer / PULSE_DURATION;
                brightness = 1.0 + 0.8 * (1 - pulseProgress); // Fade from 1.8 to 1.0
            }
            
            // Draw sparkles (behind logo)
            drawSparkles();
            
            // Draw logo at center of its bounding box
            const logoCenterX = x + logoWidth / 2;
            const logoCenterY = y + logoHeight / 2;
            drawDVDLogo(logoCenterX, logoCenterY, LOGO_SCALE, currentColor, brightness);
            
            // Draw debug overlay
            drawDebug();
            
            // Continue animation
            requestAnimationFrame(update);
        }
        
        // ============================================================
        // START
        // ============================================================
        requestAnimationFrame(update);
    </script>
</body>
</html>
